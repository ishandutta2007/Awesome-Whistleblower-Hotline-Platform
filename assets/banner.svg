<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#312e81;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Security Grid Overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1000" y1="0" x2="1000" y2="300" />
  </g>

  <!-- Pulsing Anonymity Rings -->
  <circle cx="140" cy="150" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="60;100;60" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="140" cy="150" r="110" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="90;130;90" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Main Shield Icon -->
  <g transform="translate(100, 102)" filter="url(#glow)">
    <path d="M40 0 L75 15 V45 C75 68 59 89 40 96 C21 89 5 68 5 45 V15 Z" fill="url(#shieldGrad)" />
    <!-- Lock detail inside shield -->
    <rect x="28" y="42" width="24" height="20" rx="3" fill="#0f172a" />
    <path d="M33 42 V34 C33 30 36 27 40 27 C44 27 47 30 47 34 V42" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Dynamic Signal Wave Animation -->
  <path d="M 270 225 Q 320 185, 370 225 T 470 225 T 570 225 T 670 225 T 770 225 T 870 225 T 970 225 T 1070 225" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.35">
    <animate attributeName="d" values="M 270 225 Q 320 185, 370 225 T 470 225 T 570 225 T 670 225 T 770 225 T 870 225 T 970 225 T 1070 225; M 270 225 Q 320 245, 370 225 T 470 225 T 570 225 T 670 225 T 770 225 T 870 225 T 970 225 T 1070 225; M 270 225 Q 320 185, 370 225 T 470 225 T 570 225 T 670 225 T 770 225 T 870 225 T 970 225 T 1070 225" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Header & Subtitle Typography -->
  <text x="240" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="34" fill="#ffffff" letter-spacing="0.5">
    Awesome Whistleblower Hotline Platform
  </text>
  <text x="240" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="0.2">
    Curated Open-Source &amp; Commercial Anonymous Reporting &amp; Whistleblowing Tools
  </text>

  <!-- Tag Pills -->
  <g transform="translate(240, 195)">
    <rect x="0" y="0" width="140" height="30" rx="15" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text x="70" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">Open-Source Focus</text>

    <rect x="155" y="0" width="140" height="30" rx="15" fill="rgba(129, 140, 248, 0.15)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <text x="225" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#818cf8" text-anchor="middle">EU Directive Ready</text>

    <rect x="310" y="0" width="150" height="30" rx="15" fill="rgba(52, 211, 153, 0.15)" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1" />
    <text x="385" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">SOX &amp; ISO 37002</text>
  </g>
</svg>
